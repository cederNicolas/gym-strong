/* Layout: carta de mostrador — encabezado de marca, buscador y filtros fijos, lista por categoría con precio alineado a la derecha */
:root{
  --bg:#0b0b0a; --surface:#151513; --line:#2a2925; --fg:#f3f1ea; --muted:#9b978a;
  --amber:#FFB800; --amber-ink:#111;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 18px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
h1{margin:6px 0 0;font-size:clamp(30px,8vw,46px);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--amber)}
.sub{margin:10px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
#q{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);font:600 15px var(--display);padding:12px 14px;border-radius:10px;outline:none}
#q:focus{border-color:var(--amber)}
#q::placeholder{color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line);color:var(--fg);font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.chip:focus-visible,#q:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main .wrap{padding-block:8px 40px}
section{padding-top:26px}
h2{margin:0 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
h2 small{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.name{min-width:0}
.brand{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prod{display:block;font-weight:600;font-size:15px}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.ask{color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.empty{padding:40px 0;color:var(--muted);text-align:center;font-weight:600}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:500}
footer .wrap{padding-block:18px 28px}
footer b{color:var(--fg)}
</style>
<style>body{margin:0}</style>
</head>

<style>
/* Layout: carta de mostrador — encabezado de marca, buscador y filtros fijos, lista por categoría con precio y botón de agregar; barra de pedido fija abajo */
:root{
  --bg:#0b0b0a; --surface:#151513; --raised:#1d1c19; --line:#2a2925; --fg:#f3f1ea; --muted:#9b978a;
  --amber:#FFB800; --amber-ink:#111; --wa:#25D366;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 18px;border-bottom:1px solid var(--line)}
.slogan{margin-bottom:6px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
h1{margin:0;font-size:clamp(30px,8vw,46px);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--amber)}
.sub{margin:10px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
#q,#nombre{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);font:600 15px var(--display);padding:12px 14px;border-radius:10px;outline:none}
#q:focus,#nombre:focus{border-color:var(--amber)}
#q::placeholder,#nombre::placeholder{color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}

.chip{flex:none;background:transparent;border:1px solid var(--line);color:var(--fg);font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
button:focus-visible,#q:focus-visible,#nombre:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main .wrap{padding-block:8px 120px}
section{padding-top:26px}
h2{margin:0 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
h2 small{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.name{min-width:0}
.brand{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prod{display:block;font-weight:600;font-size:15px}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.15}
.price s{font-size:12px;font-weight:600;color:var(--muted)}
.off{font-size:10.5px;font-weight:900;letter-spacing:.04em;color:var(--amber-ink);background:var(--amber);padding:2px 6px;border-radius:4px}
.ci .price{flex-direction:row;align-items:baseline;gap:6px}
.promo{background:var(--amber);color:var(--amber-ink)}
.promo .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.promo b{font-size:clamp(18px,5vw,24px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.promo span{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.price.ask{color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.add{width:38px;height:38px;border-radius:10px;border:1px solid var(--amber);background:transparent;color:var(--amber);font:800 20px/1 var(--display);cursor:pointer;display:grid;place-items:center}
.add.in{background:var(--amber);color:var(--amber-ink);font-size:14px}
.tag{display:inline-block;margin-top:5px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber);padding:3px 7px;border-radius:4px}
.empty{padding:40px 0;color:var(--muted);text-align:center;font-weight:600}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:500}
footer .wrap{padding-block:18px 28px}
footer b{color:var(--fg)}
/* barra de pedido */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--amber);color:var(--amber-ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.cartbar button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:800 14px var(--display);letter-spacing:.06em;text-transform:uppercase}
.cartbar .tot{font-variant-numeric:tabular-nums;font-size:16px;letter-spacing:0}
/* panel */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.panel{width:100%;max-width:720px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;border-top:2px solid var(--amber);padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel-head h3{margin:0;font-size:18px;font-weight:900;text-transform:uppercase}
.close{background:none;border:0;color:var(--muted);font:700 13px var(--display);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;padding:6px}
.ci{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .sub2{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.qty{display:flex;align-items:center;gap:4px;background:var(--raised);border-radius:10px;padding:2px}
.qty button{width:34px;height:34px;border:0;background:none;color:var(--fg);font:800 18px var(--display);cursor:pointer;border-radius:8px}
.qty span{min-width:22px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.line-total{font-weight:800;font-variant-numeric:tabular-nums}
.totrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:18px;text-transform:uppercase}
.totrow span:last-child{color:var(--amber);font-variant-numeric:tabular-nums}
.note{margin:0;color:var(--muted);font-size:12px;font-weight:500}
label.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.send{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#08260f;text-decoration:none;font:800 15px var(--display);text-transform:uppercase;letter-spacing:.04em;padding:16px;border-radius:12px}
.clear{background:none;border:0;color:var(--muted);font:600 12px var(--display);text-decoration:underline;cursor:pointer;align-self:center}
</style>
<style>body{margin:0}</style>
</head>

<header><div class="wrap">
  <div class="eyebrow slogan">Reach your prime</div>
  <h1>Gym <span>Strong</span><br>Suplementos</h1>
  <p class="sub" id="meta"></p>
</div></header>

<div class="promo"><div class="wrap"><span>Promo inauguración</span><b>Hasta 25% OFF</b></div></div>

<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Buscar producto o marca" autocomplete="off" aria-label="Buscar producto o marca">
  <div class="chips" id="chips" role="toolbar" aria-label="Categorías"></div>
</div></div>

<main><div class="wrap" id="list"></div></main>

<footer><div class="wrap">Consultá stock y sabores en <b>recepción</b>. Precios sujetos a cambio sin previo aviso.</div></footer>

<div class="cartbar" id="cartbar" hidden><button type="button" id="openCart"><span id="cartCount"></span><span class="tot" id="cartTot"></span></button></div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <div class="panel-head"><h3 id="ptitle">Tu pedido</h3><button class="close" type="button" id="closeCart">Cerrar</button></div>
    <div id="cartItems"></div>
    <div class="totrow"><span>Total</span><span id="sheetTot"></span></div>
    <p class="note" id="askNote" hidden>Los productos marcados “a consultar” se cotizan por WhatsApp.</p>
    <label class="lbl" for="nombre">Tu nombre</label>
    <input id="nombre" type="text" placeholder="Para saber de quién es el pedido" autocomplete="name">
    <a class="send" id="send" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
    <button class="clear" type="button" id="clearCart">Vaciar pedido</button>
  </div>
</div>
